<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Guardaditos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400..700&display=swap">
<style>
/* Concepto: un archivador de bolsillo en tres tintas. Cabecera aubergine con anillos que giran como una molécula, fichas en hielo con pestaña de carpeta, y marigold solo donde hay que actuar. */
:root{
  --ice:#DDE3E8; --aub:#3A0F34; --gold:#EAAA00;
  --bg:#DDE3E8; --surface:#EEF2F5; --surface-2:#CAD2D9; --ink:#3A0F34; --ink-soft:#5E4A5B; --line:#BCC6CE;
  --accent:#EAAA00; --accent-ink:#3A0F34; --link:#6B2263; --focus:#3A0F34; --danger:#A3191C;
  --on-bg:#3A0F34; --on-fg:#DDE3E8;
  --hero-bg:#3A0F34; --hero-ink:#DDE3E8; --hero-soft:#C3B3C0;
  --h0-bg:#EAAA00; --h0-fg:#3A0F34;
  --h1-bg:#3A0F34; --h1-fg:#DDE3E8;
  --h2-bg:color-mix(in srgb,#3A0F34 25%,#DDE3E8); --h2-fg:#3A0F34;
  --h3-bg:color-mix(in srgb,#EAAA00 40%,#DDE3E8); --h3-fg:#3A0F34;
  --h4-bg:color-mix(in srgb,#3A0F34 70%,#DDE3E8); --h4-fg:#DDE3E8;
  --f-display:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#240920; --surface:#33102D; --surface-2:#44193C; --ink:#DDE3E8; --ink-soft:#B8A9B5; --line:#552E4D;
    --accent:#EAAA00; --accent-ink:#3A0F34; --link:#EAAA00; --focus:#EAAA00; --danger:#FF8F8A;
    --on-bg:#EAAA00; --on-fg:#3A0F34;
    --h0-bg:#EAAA00; --h0-fg:#3A0F34;
    --h1-bg:#DDE3E8; --h1-fg:#3A0F34;
    --h2-bg:color-mix(in srgb,#DDE3E8 30%,#3A0F34); --h2-fg:#DDE3E8;
    --h3-bg:color-mix(in srgb,#EAAA00 45%,#3A0F34); --h3-fg:#DDE3E8;
    --h4-bg:color-mix(in srgb,#DDE3E8 55%,#3A0F34); --h4-fg:#3A0F34;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#240920; --surface:#33102D; --surface-2:#44193C; --ink:#DDE3E8; --ink-soft:#B8A9B5; --line:#552E4D;
  --accent:#EAAA00; --accent-ink:#3A0F34; --link:#EAAA00; --focus:#EAAA00; --danger:#FF8F8A;
  --on-bg:#EAAA00; --on-fg:#3A0F34;
  --h0-bg:#EAAA00; --h0-fg:#3A0F34;
  --h1-bg:#DDE3E8; --h1-fg:#3A0F34;
  --h2-bg:color-mix(in srgb,#DDE3E8 30%,#3A0F34); --h2-fg:#DDE3E8;
  --h3-bg:color-mix(in srgb,#EAAA00 45%,#3A0F34); --h3-fg:#DDE3E8;
  --h4-bg:color-mix(in srgb,#DDE3E8 55%,#3A0F34); --h4-fg:#3A0F34;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);padding-bottom:120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hero-bg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hero :focus-visible,.nav :focus-visible{outline-color:var(--gold)}

/* ---- barra superior ---- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hero-bg);color:var(--hero-ink);
  transition:box-shadow .35s var(--ease),border-radius .35s var(--ease)}
.nav.scrolled{box-shadow:0 14px 32px -14px color-mix(in srgb,var(--hero-bg) 70%,transparent);border-radius:0 0 20px 20px}
.nav-in{max-width:960px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:inline-flex;align-items:center;gap:10px;font:400 1.4rem/1 var(--f-display);min-width:0}
.brand svg{flex:none}
.brand .g1{fill:var(--gold)} .brand .g2{fill:var(--hero-ink)}
.brand-name{opacity:0;transform:translateX(-8px);transition:opacity .35s var(--ease),transform .35s var(--ease);white-space:nowrap}
.nav.scrolled .brand-name{opacity:1;transform:none}
.nav .btn.ghost{color:var(--hero-soft);min-height:36px;font-size:14px}
.nav .btn.ghost:hover{color:var(--hero-ink);border-color:transparent}

.views{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;flex:0 1 330px;
  background:color-mix(in srgb,var(--hero-ink) 10%,transparent);border:1px solid color-mix(in srgb,var(--hero-ink) 20%,transparent)}
.views::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--gold);
  transition:transform .45s cubic-bezier(.3,.9,.3,1)}
.views:has(#viewTasks[aria-pressed="true"])::before{transform:translateX(100%)}
.view{position:relative;z-index:1;min-height:38px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--hero-ink);
  font:600 14px/1 var(--f-body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:color .3s}
.view[aria-pressed="true"]{color:var(--hero-bg)}
.view .n{font:500 11.5px/1 var(--f-mono);opacity:.8}
@supports not selector(:has(*)){ .view[aria-pressed="true"]{background:var(--gold)} }

/* ---- cabecera ---- */
.hero{position:relative;overflow:hidden;background:var(--hero-bg);color:var(--hero-ink);border-radius:0 0 34px 34px}
.orbs{position:absolute;inset:0;pointer-events:none;
  transform:translate3d(calc(var(--px,0) * -16px),calc(var(--py,0) * -16px + var(--sy,0) * 1px),0);transition:transform .25s ease-out}
.glow{position:absolute;right:-12%;top:-35%;width:min(80vw,620px);aspect-ratio:1;
  background:radial-gradient(circle closest-side,color-mix(in srgb,var(--gold) 42%,transparent),transparent);animation:drift 14s ease-in-out infinite alternate}
.rings{position:absolute;right:max(-110px,-14vw);top:-50px;width:min(80vw,480px);aspect-ratio:1}
.rings circle{fill:none;stroke:var(--hero-ink);stroke-opacity:.2;stroke-width:1}
.rings .dot{fill:var(--gold);stroke:none}
.rings .dot.lt{fill:var(--hero-ink)}
.rings .core{fill:var(--gold);stroke:none}
.ring{transform-box:view-box;transform-origin:50% 50%;animation:spin 46s linear infinite}
.r2{animation-duration:30s;animation-direction:reverse}
.r3{animation-duration:20s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{to{transform:translate3d(-7%,9%,0) scale(1.12)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes draw{from{transform:scaleX(0)}}

.hero-in{position:relative;z-index:1;max-width:960px;margin-inline:auto;padding-block:22px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{margin:0 0 14px;font:500 12px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);animation:rise .8s var(--ease) backwards}
h1{margin:0;font:400 clamp(3.4rem,15vw,7rem)/.92 var(--f-display);letter-spacing:-.02em;text-wrap:balance;animation:rise .9s var(--ease) .08s backwards}
h1 em{font-style:italic;color:var(--gold)}
.sub{margin:14px 0 0;max-width:34ch;font-size:1.1rem;color:var(--hero-soft);animation:rise .9s var(--ease) .18s backwards}
.stats{position:relative;display:flex;flex-wrap:wrap;gap:12px 44px;margin-top:30px;padding-top:20px;animation:rise .9s var(--ease) .28s backwards}
.stats::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:color-mix(in srgb,var(--hero-ink) 28%,transparent);
  transform-origin:left;animation:draw 1.1s var(--ease) .55s backwards}
.stat{display:flex;flex-direction:column;gap:4px}
.num{font:400 clamp(2.6rem,10vw,4.2rem)/1 var(--f-display);font-variant-numeric:tabular-nums}
.lab{font:500 11.5px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--hero-soft)}
.count{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- contenido ---- */
.wrap{max-width:960px;margin-inline:auto;display:flex;flex-direction:column;gap:14px;padding-top:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.status{margin:0;padding:10px 14px;border:1px dashed var(--line);border-radius:12px;color:var(--ink-soft);font-size:14px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.chip,.toggle,.btn{
  min-height:40px;padding:0 15px;border:1px solid var(--line);border-radius:999px;background:var(--surface);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
  text-decoration:none;font-weight:500;transition:background .25s,border-color .25s,color .25s,transform .25s var(--ease);
}
.chip{flex:none}
.chip:hover{border-color:var(--ink);transform:translateY(-1px)}
.chip .n{font:500 12px/1 var(--f-mono);color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--on-bg);border-color:var(--on-bg);color:var(--on-fg)}
.chip[aria-pressed="true"] .n{color:var(--on-fg);opacity:.8}
.dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 35%,transparent)}
.h0{background:var(--h0-bg);color:var(--h0-fg)}
.h1{background:var(--h1-bg);color:var(--h1-fg)}
.h2{background:var(--h2-bg);color:var(--h2-fg)}
.h3{background:var(--h3-bg);color:var(--h3-fg)}
.h4{background:var(--h4-bg);color:var(--h4-fg)}
.h-none{background:var(--surface-2);color:var(--ink-soft)}

.folder-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:14px;color:var(--ink-soft)}
.folder-actions:empty{display:none}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.search{flex:1 1 220px;min-width:0}
.search input{width:100%;min-height:40px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);transition:border-color .25s}
.search input:focus{border-color:var(--ink);outline:none}
.toggle[aria-pressed="true"]{background:var(--surface-2);border-color:var(--ink-soft)}
.toggle:hover{border-color:var(--ink)}

.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.primary{position:relative;font-weight:700;color:var(--accent-ink);border-color:var(--accent);
  background:linear-gradient(90deg,var(--ink) 50%,var(--accent) 50%) right/202% 100% no-repeat;
  transition:background-position .5s var(--ease),color .35s,transform .25s var(--ease)}
.btn.primary:hover:not(:disabled){background-position:left;color:var(--bg);transform:translateY(-1px)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-soft)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--bg)}
.btn[aria-pressed="true"]{background:var(--surface-2)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.55;cursor:default}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;animation:rise .5s var(--ease) backwards}
.panel h2{font:400 1.7rem/1.1 var(--f-display);margin:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font:500 12px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.field input,.field select,.field textarea{
  width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);transition:border-color .25s,box-shadow .25s;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 55%,transparent)}
.field textarea{resize:vertical;min-height:76px}
.hint{margin:0;font:400 12.5px/1.4 var(--f-mono);color:var(--ink-soft);min-height:1.4em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.error{margin:0;color:var(--danger);font-size:14px;min-height:0}
.error:empty{display:none}
.inline-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inline-form input{flex:1 1 200px;min-width:0;min-height:40px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:40px 18px;padding-top:26px}
.card{
  position:relative;min-width:0;background:var(--surface);border:1px solid var(--line);
  border-radius:4px 20px 20px 20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;
  transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .25s;
}
.card::after{content:"";position:absolute;left:18px;right:18px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--accent);
  transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.card:hover{transform:translateY(-4px);border-color:var(--ink-soft);box-shadow:0 18px 34px -18px color-mix(in srgb,var(--ink) 55%,transparent)}
.card:hover::after{transform:scaleX(1)}
.card.example:hover{transform:none;box-shadow:none}
.card.example::after{display:none}
.tab{
  position:absolute;top:-22px;left:-1px;max-width:calc(100% - 24px);padding:4px 12px 5px;
  border-radius:9px 9px 0 0;font:500 11.5px/14px var(--f-mono);letter-spacing:.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.meta{display:flex;justify-content:space-between;gap:8px;font:500 11.5px/1.3 var(--f-mono);color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase}
.meta span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card h3{margin:0;font:400 1.65rem/1.08 var(--f-display);overflow-wrap:anywhere;text-wrap:balance}
.card.done h3{color:var(--ink-soft)}
.note{margin:0;color:var(--ink-soft);font-size:15px;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font:400 12.5px/1 var(--f-mono);padding:5px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-soft)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:2px}
.actions .ask{font-size:14px;color:var(--ink-soft)}
.move{min-height:40px;max-width:100%;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer}
.none{grid-column:1/-1;margin:0;color:var(--ink-soft)}
.empty{grid-column:1/-1;display:flex;flex-direction:column;gap:30px}
.empty p{margin:0;max-width:60ch;color:var(--ink-soft)}
.card.example{border-style:dashed;background:transparent;max-width:360px}
.badge{font:500 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}

.fab{
  position:fixed;z-index:5;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  min-height:54px;padding:0 24px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);
  font:700 16px/1 var(--f-body);cursor:pointer;box-shadow:0 10px 26px -6px color-mix(in srgb,var(--ink) 55%,transparent);
  transition:transform .3s var(--ease),box-shadow .3s var(--ease);
}
.fab:hover:not(:disabled){transform:translateY(-3px) scale(1.03);box-shadow:0 16px 30px -8px color-mix(in srgb,var(--ink) 60%,transparent)}
.fab:disabled{opacity:.5;cursor:default}
.toast{
  position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));
  max-width:calc(100% - 32px);padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.toast.show{opacity:1}
.btn.mini{min-height:36px;padding:0 10px;font-size:14px}
.tcount{align-self:flex-start;padding-left:0;color:var(--link);font-family:var(--f-mono);font-size:13px}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.task{display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0;padding-top:2px}
.check{
  flex:none;width:32px;height:32px;border-radius:9px;border:2px solid var(--ink-soft);background:transparent;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;font:800 17px/1 var(--f-body);color:var(--accent-ink);padding:0;
  transition:background .25s,border-color .25s,transform .25s var(--ease);
}
.check:hover{border-color:var(--ink);transform:scale(1.06)}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.check.static{cursor:default}
.ttext{flex:1 1 140px;min-width:0;overflow-wrap:anywhere;padding-top:3px}
.task.done .ttext{color:var(--ink-soft);text-decoration:line-through}
.tside{flex:1 0 100%;display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;padding-left:42px}
.tside .ask{font-size:14px;color:var(--ink-soft)}
.reflink{
  font:500 12.5px/1.3 var(--f-mono);color:var(--link);text-decoration:none;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 0;
}
a.reflink:hover{text-decoration:underline}

/* ---- revelado al hacer scroll ---- */
.rise{animation:rise .7s var(--ease) backwards}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}

.locked .wrap > :not(#auth){display:none!important}
.locked .views,.locked .stats,.locked .fab{display:none!important}
@media (max-width:560px){
  .row2{grid-template-columns:1fr}
  .brand-name{display:none}
  .views{flex:1 1 auto}
  .rings{width:300px;right:-110px;top:auto;bottom:-120px}
  .glow{right:-35%;top:auto;bottom:-35%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv{opacity:1;transform:none}
}
</style>

<header class="nav" id="nav">
  <div class="nav-in">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect class="g1" x="2" y="9" width="24" height="16" rx="3.5"/><path class="g2" d="M2 9.5A3.5 3.5 0 0 1 5.5 6H11l2.4 3.5H2z"/></svg>
      <span class="brand-name">Guardaditos</span>
    </div>
    <div class="views" id="views" role="group" aria-label="Vista">
      <button type="button" class="view" id="viewLinks" aria-pressed="true">Guardados <span class="n" id="nLinks"></span></button>
      <button type="button" class="view" id="viewTasks" aria-pressed="false">Tareas <span class="n" id="nTasks"></span></button>
    </div>
    <button type="button" class="btn ghost" id="logoutBtn" hidden>Cerrar sesión</button>
  </div>
</header>

<section class="hero" id="hero" aria-label="Resumen">
  <div class="orbs" aria-hidden="true">
    <div class="glow"></div>
    <svg class="rings" viewBox="0 0 400 400" focusable="false">
      <g class="ring r1"><circle cx="200" cy="200" r="190"/><circle class="dot" cx="200" cy="10" r="6"/></g>
      <g class="ring r2"><circle cx="200" cy="200" r="140"/><circle class="dot lt" cx="340" cy="200" r="5"/></g>
      <g class="ring r3"><circle cx="200" cy="200" r="90"/><circle class="dot" cx="200" cy="290" r="4"/></g>
      <circle class="core" cx="200" cy="200" r="22"/>
    </svg>
  </div>
  <div class="hero-in">
    <p class="eyebrow">Tu archivador de bolsillo</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var HUES = 5;
var LS_KEY = 'guardaditos-v1';
var SUPABASE_URL = 'https://fazlaqcepxshgrchoagi.supabase.co';
var SUPABASE_KEY = 'sb_publishable_SDAyhoseEcuyszI3kLH6EQ_xFq7X7lh';
var DEFAULT_FOLDERS = [
  { id:'f_programar', name:'Webs para programar', hue:3 },
  { id:'f_belleza', name:'Belleza', hue:0 }
];
var state = {
  mode:'loading', got:false, slow:false, confirmed:false, failed:false,
  folders:DEFAULT_FOLDERS.slice(), links:[],
  folder:'all', pending:false, q:'',
  editing:null, confirmDel:null, confirmFolder:false,
  view:'links', tasks:[], confirmTask:null, loaded:{}
};
var appRef = null, linksRef = null, tasksRef = null, queue = Promise.resolve(), toastTimer = null, slowTimer = null;

/* ---------- utilidades ---------- */
function h(tag, attrs, kids){
  var e = document.createElement(tag);
  if(attrs){
    Object.keys(attrs).forEach(function(k){
      var v = attrs[k];
      if(v === false || v == null) return;
      if(k === 'class') e.className = v;
      else if(k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    });
  }
  if(kids != null){
    (Array.isArray(kids) ? kids : [kids]).forEach(function(c){
      if(c == null || c === false) return;
      e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
  }
  return e;
}
function rid(p){
  var s;
  try { s = crypto.randomUUID().replace(/-/g,'').slice(0,12); }
  catch(e){ s = Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
  return p + s;
}
function normUrl(s){
  s = (s || '').trim();
  if(!s) return '';
  if(!/^[a-z][a-z0-9+.\-]*:/i.test(s)) s = 'https://' + s;
  try{
    var u = new URL(s);
    if(u.protocol !== 'http:' && u.protocol !== 'https:') return '';
    if(!u.hostname || u.hostname.indexOf('.') < 0) return '';
    return u.href;
  }catch(e){ return ''; }
}
function detect(url){
  try{
    var u = new URL(url), host = u.hostname.replace(/^www\./,''), path = u.pathname;
    if(/(^|\.)instagram\.com$/.test(host)) return /\/reels?\//.test(path) ? 'Instagram · Reel' : (/\/p\//.test(path) ? 'Instagram · Post' : 'Instagram');
    if(/(^|\.)tiktok\.com$/.test(host)) return 'TikTok';
    if(/(^|\.)youtube\.com$/.test(host) && /\/shorts\//.test(path)) return 'YouTube · Short';
    if(/(^|\.)(youtube\.com|youtu\.be)$/.test(host)) return 'YouTube';
    return host;
  }catch(e){ return ''; }
}
function parseTags(s){
  var seen = {}, out = [];
  (s || '').split(/[,\s]+/).forEach(function(t){
    t = t.replace(/^#+/,'').trim().toLowerCase().slice(0,24);
    if(t && !seen[t]){ seen[t] = 1; out.push(t); }
  });
  return out.slice(0,8);
}
function fmtDate(ts){
  if(!ts) return '';
  try{ return new Date(ts).toLocaleDateString('es-ES',{day:'numeric',month:'short'}); }catch(e){ return ''; }
}
function folderById(id){
  if(!id) return null;
  for(var i=0;i<state.folders.length;i++) if(state.folders[i].id === id) return state.folders[i];
  return null;
}
function plural(n, one, many){ return n + ' ' + (n === 1 ? one : many); }
function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2800);
}

/* ---------- persistencia ---------- */
function enqueue(fn){
  queue = queue.then(fn).catch(function(){ toast('No se pudo guardar. Inténtalo de nuevo.'); });
  return queue;
}
function lsLoad(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    var o = JSON.parse(raw);
    if(o && Array.isArray(o.links)) state.links = o.links;
    if(o && Array.isArray(o.tasks)) state.tasks = o.tasks;
    if(o && Array.isArray(o.folders) && o.folders.length) state.folders = o.folders;
  }catch(e){}
}
function lsSave(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({ folders:state.folders, links:state.links, tasks:state.tasks })); }catch(e){}
}
function persistLink(l){
  if(state.mode === 'db'){
    var ref = linksRef.doc(l.id);
    var body = { url:l.url, title:l.title, note:l.note, folderId:l.folderId, tags:l.tags, done:!!l.done, createdAt:l.createdAt };
    enqueue(function(){ return ref.set(body); });
  } else lsSave();
}
function persistRemove(id){
  if(state.mode === 'db'){
    var ref = linksRef.doc(id);
    enqueue(function(){ return ref.delete(); });
  } else lsSave();
}
function persistTask(t){
  if(state.mode === 'db'){
    var ref = tasksRef.doc(t.id);
    var body = { text:t.text, folderId:t.folderId, linkId:t.linkId, done:!!t.done, createdAt:t.createdAt };
    enqueue(function(){ return ref.set(body); });
  } else lsSave();
}
function persistTaskRemove(id){
  if(state.mode === 'db'){
    var ref = tasksRef.doc(id);
    enqueue(function(){ return ref.delete(); });
  } else lsSave();
}
function persistFolders(){
  if(state.mode === 'db'){
    var fs = state.folders;
    enqueue(function(){ return appRef.set({ folders:fs }); });
  } else lsSave();
}
function upsertTask(t){
  var exists = state.tasks.some(function(x){ return x.id === t.id; });
  state.tasks = exists ? state.tasks.map(function(x){ return x.id === t.id ? t : x; }) : state.tasks.concat([t]);
  persistTask(t);
  renderAll();
}
function removeTask(id){
  state.tasks = state.tasks.filter(function(x){ return x.id !== id; });
  persistTaskRemove(id);
  renderAll();
}
function patchTasks(pred, patch){
  state.tasks = state.tasks.map(function(t){
    if(!pred(t)) return t;
    var n = Object.assign({}, t, patch);
    persistTask(n);
    return n;
  });
}
function upsert(l){
  var exists = state.links.some(function(x){ return x.id === l.id; });
  state.links = exists ? state.links.map(function(x){ return x.id === l.id ? l : x; }) : state.links.concat([l]);
  persistLink(l);
  renderAll();
}
function removeLink(id){
  state.links = state.links.filter(function(x){ return x.id !== id; });
  persistRemove(id);
  patchTasks(function(t){ return t.linkId === id; }, { linkId:'' });
  renderAll();
}
function setFolders(fs){
  state.folders = fs;
  persistFolders();
  renderAll();
}

/* ---------- render ---------- */
function visible(){
  var q = state.q.trim().toLowerCase();
  return state.links.filter(function(l){
    if(state.folder === 'none'){ if(folderById(l.folderId)) return false; }
    else if(state.folder !== 'all' && l.folderId !== state.folder) return false;
    if(state.pending && l.done) return false;
    if(q){
      var hay = [l.title, l.note, (l.tags || []).join(' '), l.url].join(' ').toLowerCase();
      if(hay.indexOf(q) < 0) return false;
    }
    return true;
  }).sort(function(a,b){ return (b.createdAt || 0) - (a.createdAt || 0); });
}
function viewItems(){ return state.view === 'tasks' ? state.tasks : state.links; }
function renderAll(){
  if(state.folder !== 'all'){
    var orphans = viewItems().filter(function(x){ return !folderById(x.folderId); }).length;
    if(state.folder === 'none' ? !orphans : !folderById(state.folder)) state.folder = 'all';
  }
  renderViews(); renderCount(); renderStatus(); renderChips(); renderFolderActions(); renderList();
}
function renderViews(){
  var t = state.view === 'tasks';
  $('viewLinks').setAttribute('aria-pressed', t ? 'false' : 'true');
  $('viewTasks').setAttribute('aria-pressed', t ? 'true' : 'false');
  $('nLinks').textContent = state.links.length ? String(state.links.length) : '';
  var pend = state.tasks.filter(function(x){ return !x.done; }).length;
  $('nTasks').textContent = pend ? String(pend) : '';
  setStat($('heroLinks'), state.links.length);
  setStat($('heroTasks'), pend);
  $('pendingBtn').textContent = t ? 'Solo pendientes' : 'Solo por ver';
  $('q').placeholder = t ? 'Buscar tareas' : 'Buscar por título, nota o etiqueta';
  $('fab').textContent = t ? '+ Nueva tarea' : '+ Guardar enlace';
}
function renderCount(){
  if(state.view === 'tasks'){
    var n = state.tasks.length, p = state.tasks.filter(function(x){ return !x.done; }).length;
    $('count').textContent = n ? plural(n,'tarea','tareas') + ' · ' + p + (p === 1 ? ' pendiente' : ' pendientes') : '';
    return;
  }
  var total = state.links.length, left = state.links.filter(function(l){ return !l.done; }).length;
  $('count').textContent = total ? plural(total,'guardado','guardados') + ' · ' + left + ' por ver' : '';
}
function renderStatus(){
  var s = $('status'), msg = '';
  if(state.failed) msg = 'No se pueden cargar tus guardados ahora mismo. Vuelve a abrir la página en un rato.';
  else if(state.mode === 'loading' || (state.mode === 'db' && !state.got)) msg = state.slow ? 'Todavía no se alcanzan tus guardados. Si ves datos, pueden no estar al día.' : 'Cargando tus guardados…';
  else if(state.mode === 'db' && state.slow && !state.confirmed) msg = 'Si ves datos, pueden no estar al día: no se ha podido confirmar la conexión.';
  else if(state.mode === 'local') msg = 'Sin cuenta conectada: tus guardados se quedan solo en este navegador.';
  s.hidden = !msg;
  s.textContent = msg;
}
function chip(key, label, n, hue){
  return h('button', {
    type:'button', class:'chip', 'aria-pressed': state.folder === key ? 'true' : 'false',
    onclick:function(){ state.folder = key; state.confirmFolder = false; renderAll(); }
  }, [
    hue != null ? h('span',{class:'dot h' + (hue % HUES)}) : null,
    h('span',null,label),
    h('span',{class:'n'}, String(n))
  ]);
}
function renderChips(){
  var box = $('chips');
  box.textContent = '';
  var tv = state.view === 'tasks', items = viewItems();
  function cnt(pred){ return items.filter(function(x){ return pred(x) && (!tv || !x.done); }).length; }
  box.appendChild(chip('all','Todos',cnt(function(){ return true; }),null));
  state.folders.forEach(function(f){
    box.appendChild(chip(f.id, f.name, cnt(function(x){ return x.folderId === f.id; }), f.hue));
  });
  var hasOrphans = items.some(function(x){ return !folderById(x.folderId); });
  if(hasOrphans) box.appendChild(chip('none','Sin carpeta',cnt(function(x){ return !folderById(x.folderId); }),null));
}
function renderFolderActions(){
  var box = $('folderActions');
  box.textContent = '';
  var f = folderById(state.folder);
  if(!f) return;
  var n = state.links.concat(state.tasks).filter(function(x){ return x.folderId === f.id; }).length;
  if(!state.confirmFolder){
    box.appendChild(h('span',null,'Carpeta «' + f.name + '»'));
    box.appendChild(h('button',{type:'button',class:'btn ghost',onclick:function(){ state.confirmFolder = true; renderFolderActions(); }},'Borrar carpeta'));
  } else {
    box.appendChild(h('span',null, n ? 'Sus ' + plural(n,'elemento','elementos') + ' (guardados y tareas) pasarán a «Sin carpeta». ¿Borrar la carpeta?' : '¿Borrar la carpeta vacía?'));
    box.appendChild(h('button',{type:'button',class:'btn danger',onclick:function(){
      var id = f.id;
      state.links.filter(function(l){ return l.folderId === id; }).forEach(function(l){
        var moved = Object.assign({}, l, { folderId:'' });
        state.links = state.links.map(function(x){ return x.id === l.id ? moved : x; });
        persistLink(moved);
      });
      patchTasks(function(t){ return t.folderId === id; }, { folderId:'' });
      state.tasks.filter(function(t){ return t.folderId === id; }).forEach(function(t){
        var movedT = Object.assign({}, t, { folderId:'' });
        state.tasks = state.tasks.map(function(x){ return x.id === t.id ? movedT : x; });
        persistTask(movedT);
      });
      state.folder = 'all'; state.confirmFolder = false;
      setFolders(state.folders.filter(function(x){ return x.id !== id; }));
      toast('Carpeta borrada');
    }},'Sí, borrar'));
    box.appendChild(h('button',{type:'button',class:'btn',onclick:function(){ state.confirmFolder = false; renderFolderActions(); }},'No'));
  }
}
function tabFor(f){
  return f ? h('span',{class:'tab h' + (f.hue % HUES)}, f.name) : h('span',{class:'tab h-none'},'Sin carpeta');
}
function card(l){
  var f = folderById(l.folderId), href = normUrl(l.url), ts = taskStat(l);
  var move = h('select',{class:'move','aria-label':'Mover «' + l.title + '» a otra carpeta',onchange:function(e){
    var v = e.target.value;
    if(!v) return;
    var target = v === '__none' ? '' : v;
    if(target !== (l.folderId || '')) upsert(Object.assign({}, l, { folderId:target }));
    else e.target.value = '';
  }}, [h('option',{value:'',disabled:true,selected:true},'Mover a…'), h('option',{value:'__none'},'Sin carpeta')]
    .concat(state.folders.map(function(x){ return h('option',{value:x.id},x.name); })));
  var actions;
  if(state.confirmDel === l.id){
    actions = h('div',{class:'actions'},[
      h('span',{class:'ask'},'¿Borrar este guardado?'),
      h('button',{type:'button',class:'btn danger',onclick:function(){ state.confirmDel = null; removeLink(l.id); toast('Guardado borrado'); }},'Sí, borrar'),
      h('button',{type:'button',class:'btn',onclick:function(){ state.confirmDel = null; renderList(); }},'No')
    ]);
  } else {
    actions = h('div',{class:'actions'},[
      href ? h('a',{class:'btn primary',href:href,target:'_blank',rel:'noopener noreferrer'},'Abrir ↗') : h('span',{class:'btn','aria-disabled':'true'},'Enlace no válido'),
      h('button',{type:'button',class:'btn','aria-pressed':l.done ? 'true' : 'false',onclick:function(){ upsert(Object.assign({}, l, { done:!l.done })); }}, l.done ? 'Visto ✓' : 'Marcar visto'),
      move,
      h('button',{type:'button',class:'btn ghost',onclick:function(){ openTaskFor(l); }},'+ Tarea'),
      h('button',{type:'button',class:'btn ghost',onclick:function(){ openComposer(l); }},'Editar'),
      h('button',{type:'button',class:'btn ghost',onclick:function(){ state.confirmDel = l.id; renderList(); }},'Borrar')
    ]);
  }
  return h('article',{class:'card' + (l.done ? ' done' : '')},[
    tabFor(f),
    h('div',{class:'meta'},[h('span',null,detect(l.url)),h('span',null,fmtDate(l.createdAt))]),
    h('h3',null,l.title || detect(l.url) || 'Sin título'),
    l.note ? h('p',{class:'note'},l.note) : null,
    (l.tags && l.tags.length) ? h('div',{class:'tags'},l.tags.map(function(t){ return h('span',null,'#' + t); })) : null,
    ts.n ? h('button',{type:'button',class:'btn ghost mini tcount',onclick:function(){ goTasks(l); }},'Tareas ' + ts.d + '/' + ts.n) : null,
    actions
  ]);
}
function emptyBlock(){
  return h('div',{class:'empty'},[
    h('p',null,'Aún no has guardado nada. Pulsa «Guardar enlace», pega el link de un reel y elige su carpeta. Así se verá:'),
    h('article',{class:'card example'},[
      h('span',{class:'tab h3'},'Webs para programar'),
      h('div',{class:'meta'},[h('span',null,'Instagram · Reel'),h('span',{class:'badge'},'Ejemplo')]),
      h('h3',null,'5 webs para aprender a programar gratis'),
      h('p',{class:'note'},'Ejercicios desde cero, probar el de CSS primero.'),
      h('div',{class:'tags'},[h('span',null,'#html'),h('span',null,'#css'),h('span',null,'#gratis')]),
      h('div',{class:'actions'},[h('span',{class:'btn primary','aria-disabled':'true'},'Abrir ↗')])
    ])
  ]);
}
function renderList(){
  var box = $('list');
  box.textContent = '';
  var ready = state.mode === 'local' || (state.mode === 'db' && state.got);
  if(!ready) return;
  if(state.view === 'tasks'){ renderTasks(); return; }
  if(!state.links.length){ box.appendChild(emptyBlock()); return; }
  var items = visible();
  if(!items.length){ box.appendChild(h('p',{class:'none'},'No hay nada que coincida con este filtro.')); return; }
  items.forEach(function(l){ box.appendChild(card(l)); });
}

/* ---------- tareas ---------- */
function linkById(id){
  if(!id) return null;
  for(var i=0;i<state.links.length;i++) if(state.links[i].id === id) return state.links[i];
  return null;
}
function taskStat(l){
  var lt = state.tasks.filter(function(t){ return t.linkId === l.id; });
  return { n:lt.length, d:lt.filter(function(t){ return t.done; }).length };
}
function taskRow(t){
  var l = linkById(t.linkId), href = l ? normUrl(l.url) : '';
  var side = [];
  if(l && href) side.push(h('a',{class:'reflink',href:href,target:'_blank',rel:'noopener noreferrer',title:l.title},'↗ ' + l.title));
  if(state.confirmTask === t.id){
    side.push(h('span',{class:'ask'},'¿Borrar esta tarea?'));
    side.push(h('button',{type:'button',class:'btn danger mini',onclick:function(){ state.confirmTask = null; removeTask(t.id); toast('Tarea borrada'); }},'Sí, borrar'));
    side.push(h('button',{type:'button',class:'btn mini',onclick:function(){ state.confirmTask = null; renderList(); }},'No'));
  } else {
    side.push(h('button',{type:'button',class:'btn ghost mini',onclick:function(){ state.confirmTask = t.id; renderList(); }},'Borrar'));
  }
  return h('li',{class:'task' + (t.done ? ' done' : '')},[
    h('button',{type:'button',class:'check','aria-pressed':t.done ? 'true' : 'false','aria-label':(t.done ? 'Desmarcar: ' : 'Marcar como hecha: ') + t.text,
      onclick:function(){ upsertTask(Object.assign({}, t, { done:!t.done })); }}, t.done ? '✓' : ''),
    h('span',{class:'ttext'},t.text),
    h('div',{class:'tside'},side)
  ]);
}
function taskCard(f, shown, all){
  var done = all.filter(function(t){ return t.done; }).length;
  var key = f ? f.id : '';
  return h('article',{class:'card'},[
    tabFor(f),
    h('div',{class:'meta'},[h('span',null,'Tareas'),h('span',null,all.length ? done + '/' + all.length + ' hechas' : '')]),
    shown.length ? h('ul',{class:'tlist'},shown.map(taskRow)) : h('p',{class:'note'},all.length ? 'No hay tareas con este filtro.' : 'Aún no hay tareas en esta carpeta.'),
    h('div',{class:'actions'},[h('button',{type:'button',class:'btn',onclick:function(){ openTaskComposer({ folderId:key }); }},'+ Añadir tarea')])
  ]);
}
function exTask(text, done, ref){
  return h('li',{class:'task' + (done ? ' done' : '')},[
    h('span',{class:'check static','aria-hidden':'true','style':done ? 'background:var(--accent);border-color:var(--accent)' : null}, done ? '✓' : ''),
    h('span',{class:'ttext'},text),
    ref ? h('div',{class:'tside'},[h('span',{class:'reflink'},'↗ ' + ref)]) : null
  ]);
}
function emptyTasks(){
  return h('div',{class:'empty'},[
    h('p',null,'Aún no tienes tareas. Crea una dentro de una carpeta y, si quieres, enlázala a uno de tus guardados para saber de qué vídeo viene. Así se verá:'),
    h('article',{class:'card example'},[
      h('span',{class:'tab h3'},'Webs para programar'),
      h('div',{class:'meta'},[h('span',null,'Tareas'),h('span',{class:'badge'},'Ejemplo')]),
      h('ul',{class:'tlist'},[
        exTask('Instalar Python', true, '5 webs para aprender a programar gratis'),
        exTask('Hacer el primer ejercicio de CSS', false, '5 webs para aprender a programar gratis')
      ])
    ])
  ]);
}
function renderTasks(){
  var box = $('list');
  var q = state.q.trim().toLowerCase();
  function match(t){
    if(state.pending && t.done) return false;
    if(q){
      var l = linkById(t.linkId);
      if((t.text + ' ' + (l ? l.title : '')).toLowerCase().indexOf(q) < 0) return false;
    }
    return true;
  }
  var groups;
  if(state.folder === 'all') groups = state.folders.map(function(f){ return { f:f }; }).concat([{ f:null }]);
  else if(state.folder === 'none') groups = [{ f:null }];
  else groups = [{ f:folderById(state.folder) }];
  groups.forEach(function(g){
    var all = state.tasks.filter(function(t){ return g.f ? t.folderId === g.f.id : !folderById(t.folderId); });
    var shown = all.filter(match).sort(function(a,b){ return (a.createdAt || 0) - (b.createdAt || 0); });
    if(state.folder === 'all' && !all.length) return;
    if(q && !shown.length) return;
    box.appendChild(taskCard(g.f, shown, all));
  });
  if(!box.children.length){
    if(!state.tasks.length) box.appendChild(emptyTasks());
    else box.appendChild(h('p',{class:'none'},'No hay nada que coincida con este filtro.'));
  }
}
var tel = { text:$('t-text'), folder:$('t-folder'), link:$('t-link'), err:$('t-error') };
function syncFab(){ $('fab').hidden = !$('composer').hidden || !$('taskComposer').hidden; }

/* ---------- movimiento ---------- */
var reduced = false;
try{ reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
function setStat(el, to){
  if(!el) return;
  var from = parseInt(el.getAttribute('data-v') || '0', 10);
  el.setAttribute('data-v', String(to));
  if(reduced || from === to){ el.textContent = String(to); return; }
  var t0 = null, dur = 750, tok = (el._tok = (el._tok || 0) + 1);
  function step(t){
    if(el._tok !== tok) return;
    if(t0 === null) t0 = t;
    var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = String(Math.round(from + (to - from) * e));
    if(p < 1) requestAnimationFrame(step); else el.textContent = String(to);
  }
  requestAnimationFrame(step);
}
(function(){
  var hero = $('hero'), nav = $('nav'), ticking = false;
  function onScroll(){
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      ticking = false;
      var y = window.scrollY || 0;
      nav.classList.toggle('scrolled', y > 40);
      if(!reduced) hero.style.setProperty('--sy', String(Math.round(-y * 0.16)));
    });
  }
  window.addEventListener('scroll', onScroll, { passive:true });
  onScroll();
  if(!reduced){
    var moving = false, lx = 0, ly = 0;
    hero.addEventListener('pointermove', function(e){
      lx = e.clientX; ly = e.clientY;
      if(moving) return;
      moving = true;
      requestAnimationFrame(function(){
        moving = false;
        var r = hero.getBoundingClientRect();
        hero.style.setProperty('--px', ((lx - r.left) / r.width - 0.5).toFixed(3));
        hero.style.setProperty('--py', ((ly - r.top) / r.height - 0.5).toFixed(3));
      });
    });
    hero.addEventListener('pointerleave', function(){
      hero.style.setProperty('--px', '0'); hero.style.setProperty('--py', '0');
    });
  }
  var box = $('list'), lastKey = null, io = null;
  function revealList(){
    var key = state.view + '|' + state.folder;
    var kids = Array.prototype.slice.call(box.children);
    if(!kids.length || key === lastKey) return;
    lastKey = key;
    if(reduced) return;
    if(io){ io.disconnect(); io = null; }
    var vh = window.innerHeight || 800, idx = 0, lazy = [];
    kids.forEach(function(k){
      if(k.getBoundingClientRect().top < vh){
        k.style.animationDelay = (idx++ * 70) + 'ms';
        k.classList.add('rise');
      } else { k.classList.add('rv'); lazy.push(k); }
    });
    function show(k){
      k.classList.add('in');
      setTimeout(function(){ k.classList.remove('rv', 'in'); }, 800);
    }
    if(lazy.length && 'IntersectionObserver' in window){
      io = new IntersectionObserver(function(es){
        es.forEach(function(en){
          if(en.isIntersecting){ show(en.target); io.unobserve(en.target); }
        });
      }, { threshold:0.08 });
      lazy.forEach(function(k){ io.observe(k); });
      setTimeout(function(){ lazy.forEach(function(k){ if(k.classList.contains('rv')) show(k); }); }, 2500);
    } else lazy.forEach(show);
  }
  if('MutationObserver' in window) new MutationObserver(revealList).observe(box, { childList:true });
})();

/* ---------- arranque ---------- */
function goLocal(){
  state.mode = 'local';
  lsLoad();
  $('fab').disabled = false;
  renderAll();
}
function onDbError(){
  state.failed = true;
  renderAll();
}
function afterSnapshot(key, fromCache){
  state.loaded[key] = true;
  state.got = !!(state.loaded.app && state.loaded.links && state.loaded.tasks);
  if(!fromCache){
    state.confirmed = true; state.slow = false;
    clearTimeout(slowTimer);
  }
  renderAll();
}
function startDb(db, uid){
  state.mode = 'db';
  appRef = db.doc('data/users/' + uid + '/app');
  linksRef = appRef.collection('links');
  tasksRef = appRef.collection('tasks');
  slowTimer = setTimeout(function(){ if(!state.confirmed){ state.slow = true; renderAll(); } }, 10000);
  $('fab').disabled = false;
  appRef.onSnapshot(function(snap){
    var d = snap.exists ? snap.data() : null;
    state.folders = (d && Array.isArray(d.folders)) ? d.folders.slice() : DEFAULT_FOLDERS.slice();
    afterSnapshot('app', snap.metadata.fromCache);
  }, onDbError);
  linksRef.onSnapshot(function(snap){
    state.links = snap.docs.map(function(d){ var o = Object.assign({}, d.data()); o.id = d.id; return o; });
    afterSnapshot('links', snap.metadata.fromCache);
  }, onDbError);
  tasksRef.onSnapshot(function(snap){
    state.tasks = snap.docs.map(function(d){ var o = Object.assign({}, d.data()); o.id = d.id; return o; });
    afterSnapshot('tasks', snap.metadata.fromCache);
  }, onDbError);
}
/* ---------- Supabase: cuenta y sincronización ---------- */
var sbClient = null;
function supaReady(){
  return !!(window.supabase && /^https:\/\//.test(SUPABASE_URL) && SUPABASE_KEY.length > 20);
}
function makeSupaDb(sb, uid){
  var mem = { app:null, link:{}, task:{} }, loaded = false;
  var subs = { app:[], link:[], task:[] }, errs = [];
  function appSnap(){ var d = mem.app; return { exists:!!d, data:function(){ return d; }, metadata:{ fromCache:false } }; }
  function collSnap(k){
    var o = mem[k];
    return { docs:Object.keys(o).map(function(id){ return { id:id, data:function(){ return o[id]; } }; }), metadata:{ fromCache:false } };
  }
  function notify(k){
    if(!loaded) return;
    subs[k].forEach(function(f){ f(k === 'app' ? appSnap() : collSnap(k)); });
  }
  function slot(kind){ return kind === 'folders' ? 'app' : kind; }
  function check(r){ if(r && r.error) throw r.error; }
  function put(kind, id, data){
    if(kind === 'folders') mem.app = data; else mem[kind][id] = data;
    notify(slot(kind));
    return sb.from('items').upsert({ user_id:uid, kind:kind, id:id, data:data, updated_at:new Date().toISOString() }).then(check);
  }
  function del(kind, id){
    delete mem[kind][id];
    notify(kind);
    return sb.from('items').delete().eq('user_id', uid).eq('kind', kind).eq('id', id).then(check);
  }
  function load(){
    return sb.from('items').select('kind,id,data').then(function(r){
      if(r.error) throw r.error;
      var next = { app:null, link:{}, task:{} };
      (r.data || []).forEach(function(row){
        if(row.kind === 'folders') next.app = row.data;
        else if(next[row.kind]) next[row.kind][row.id] = row.data;
      });
      mem = next; loaded = true;
      notify('app'); notify('link'); notify('task');
    }).catch(function(e){
      errs.forEach(function(f){ if(f) f({ code:'unavailable', message:String((e && e.message) || e) }); });
    });
  }
  function collRef(k){
    return {
      doc:function(id){ return { set:function(d){ return put(k, id, d); }, delete:function(){ return del(k, id); } }; },
      onSnapshot:function(next, err){ subs[k].push(next); errs.push(err); if(loaded) next(collSnap(k)); return function(){}; }
    };
  }
  var appRef = {
    set:function(d){ return put('folders', 'app', d); },
    onSnapshot:function(next, err){ subs.app.push(next); errs.push(err); if(loaded) next(appSnap()); return function(){}; },
    collection:function(name){ return collRef(name === 'links' ? 'link' : 'task'); }
  };
  try{
    sb.channel('items-' + uid).on('postgres_changes', { event:'*', schema:'public', table:'items', filter:'user_id=eq.' + uid }, function(p){
      var del_ = p.eventType === 'DELETE', row = del_ ? p.old : p.new;
      if(!row || !row.kind) return;
      if(del_){ if(row.kind !== 'folders' && mem[row.kind]) delete mem[row.kind][row.id]; }
      else if(row.kind === 'folders') mem.app = row.data;
      else if(mem[row.kind]) mem[row.kind][row.id] = row.data;
      notify(slot(row.kind));
    }).subscribe();
  }catch(e){}
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && loaded) load(); });
  load();
  return { doc:function(){ return appRef; } };
}
function showAuth(){
  document.body.classList.add('locked');
  $('auth').hidden = false;
  $('a-email').focus();
}
function enterApp(user){
  $('auth').hidden = true;
  document.body.classList.remove('locked');
  $('logoutBtn').hidden = false;
  $('logoutBtn').title = user.email || '';
  startDb(makeSupaDb(sbClient, user.id), user.id);
}
function authMsg(e){
  var m = String((e && e.message) || '');
  if(/invalid login credentials/i.test(m)) return 'Correo o contraseña incorrectos.';
  if(/email not confirmed/i.test(m)) return 'Falta confirmar el correo. Mira tu bandeja de entrada.';
  if(/already registered/i.test(m)) return 'Ese correo ya tiene cuenta. Pulsa Entrar.';
  if(/signups? not allowed|signup is disabled/i.test(m)) return 'El registro de cuentas nuevas está desactivado.';
  if(/rate limit/i.test(m)) return 'Demasiados intentos. Espera unos minutos.';
  return m || 'No se pudo completar. Inténtalo de nuevo.';
}
function setAuthBusy(b){
  $('a-signup').disabled = b;
  $('authForm').querySelector('button[type="submit"]').disabled = b;
}
function doAuth(mode){
  var email = $('a-email').value.trim(), pass = $('a-pass').value;
  $('a-error').textContent = ''; $('a-info').textContent = '';
  if(!email || pass.length < 8){
    $('a-error').textContent = 'Escribe tu correo y una contraseña de al menos 8 caracteres.';
    return;
  }
  setAuthBusy(true);
  var p = mode === 'in'
    ? sbClient.auth.signInWithPassword({ email:email, password:pass })
    : sbClient.auth.signUp({ email:email, password:pass });
  p.then(function(r){
    setAuthBusy(false);
    if(r.error){ $('a-error').textContent = authMsg(r.error); return; }
    if(r.data && r.data.session) enterApp(r.data.session.user);
    else $('a-info').textContent = 'Te hemos enviado un correo para confirmar tu cuenta. Ábrelo y después vuelve aquí a entrar.';
  }).catch(function(){
    setAuthBusy(false);
    $('a-error').textContent = 'No se pudo conectar. Revisa tu conexión e inténtalo de nuevo.';
  });
}
function startSupabase(){
  sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  $('authForm').addEventListener('submit', function(e){ e.preventDefault(); doAuth('in'); });
  $('a-signup').addEventListener('click', function(){ doAuth('up'); });
  $('logoutBtn').addEventListener('click', function(){ sbClient.auth.signOut(); });
  sbClient.auth.onAuthStateChange(function(ev){ if(ev === 'SIGNED_OUT') location.reload(); });
  sbClient.auth.getSession().then(function(r){
    var s = r && r.data && r.data.session;
    if(s) enterApp(s.user); else showAuth();
  }).catch(function(){ showAuth(); });
}
function boot(){
  renderAll();
  if(!(window.claude && window.claude.use)){
    if(supaReady()) startSupabase(); else goLocal();
    return;
  }
  Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function(r){
    var db = r[0], user = r[1];
    if(!db || !user){ goLocal(); return null; }
    return user.id().then(function(uid){
      if(!uid){ goLocal(); return; }
      startDb(db, uid);
    });
  }).catch(function(){ goLocal(); });
}
boot();
})();
